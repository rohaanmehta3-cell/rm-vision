<title id="title">Investment workflow</title><desc id="desc">The data lake feeds a proposed econometrics research agent and the specialist PM bench. The agent logs testable candidates for PM review and qualification. Qualification and live proposals inform the shared harness. Humans allocate risk and approve execution. Live results feed back into training and allocation review.</desc>
