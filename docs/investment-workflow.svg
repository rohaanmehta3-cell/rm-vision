<g transform="translate(24 300)"><rect width="442" height="100" rx="12" fill="#ffffff" stroke="#a5bac8"/><text x="18" y="30" font-size="22" font-weight="bold" fill="#132d40">Specialist PM bench</text><text x="18" y="55" font-size="17" fill="#28495d">Macro · Fundamental equities</text><text x="18" y="78" font-size="17" fill="#28495d">Systematic quant · Event-driven</text></g>
<g transform="translate(24 426)"><rect width="442" height="100" rx="12" fill="#ffffff" stroke="#a5bac8"/><text x="18" y="30" font-size="22" font-weight="bold" fill="#132d40">Training and qualification</text><text x="18" y="55" font-size="17" fill="#28495d">Refine playbooks and fit signals where applicable</text><text x="18" y="78" font-size="17" fill="#28495d">Test across regimes and run shadow portfolios</text></g>
